name: ed_screen_recorder
description: Screen Recorder for Flutter (vendored fork with Android modern-permission fixes). Requires Android SDK 24+ and iOS 10+.
version: 0.0.16

publish_to: 'none'

environment:
  sdk: ">=2.12.0 <4.0.0"
  flutter: ">=1.20.0"

dependencies:
  flutter:
    sdk: flutter
  uuid: ^3.0.6

flutter:

  plugin:
    platforms:
      android:
        package: com.ed_screen_recorder.ed_screen_recorder
        pluginClass: EdScreenRecorderPlugin
      ios:
        pluginClass: EdScreenRecorderPlugin