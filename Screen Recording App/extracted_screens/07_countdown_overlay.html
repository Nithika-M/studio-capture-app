<!-- Script for realistic countdown pulse & dismiss interaction -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
      const numElem = document.getElementById('countdown-number');
      const cancelBtn = document.getElementById('cancel-btn');
      let currentVal = 3;

      const countdownInterval = setInterval(() => {
        if (currentVal > 1) {
          currentVal--;
          numElem.classList.add('scale-75', 'opacity-50');
          setTimeout(() => {
            numElem.textContent = currentVal;
            numElem.classList.remove('scale-75', 'opacity-50');
          }, 120);
        } else {
          clearInterval(countdownInterval);
          numElem.classList.add('scale-75', 'opacity-50');
          setTimeout(() => {
            numElem.textContent = 'REC';
            numElem.classList.add('text-primary-container');
            numElem.classList.remove('scale-75', 'opacity-50');
          }, 120);
        }
      }, 1000);

      cancelBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        clearInterval(countdownInterval);
        numElem.textContent = 'STOP';
        numElem.classList.add('text-secondary');
      });
    });
  </script>
