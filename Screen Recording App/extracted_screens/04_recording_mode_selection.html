<!-- Lightweight Interaction Script for Mode Switching -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
      const cards = document.querySelectorAll('.mode-card');

      cards.forEach(card => {
        card.addEventListener('click', () => {
          // Reset all cards
          cards.forEach(c => {
            c.classList.remove('border-2', 'border-red-500', 'recording-radial-glow');
            c.classList.add('border', 'border-gray-200');
            
            // Remove radial glow child if exists
            const glow = c.querySelector('.blur-2xl');
            if (glow) glow.remove();

            // Reset icon container
            const iconBox = c.querySelector('.w-11');
            if (iconBox) {
              iconBox.className = 'w-11 h-11 rounded-2xl bg-gray-50 flex items-center justify-center border border-gray-200 text-gray-700 group-hover:text-gray-900 group-hover:bg-gray-100 transition-colors';
              const icon = iconBox.querySelector('.material-symbols-outlined');
              if (icon) icon.classList.remove('material-symbols-fill');
            }

            // Reset radio pip indicator
            const pip = c.querySelector('.w-6');
            if (pip) {
              pip.className = 'w-6 h-6 rounded-full border-2 border-gray-300 flex items-center justify-center bg-transparent';
              pip.innerHTML = '<div class="w-2 h-2 rounded-full bg-transparent"></div>';
            }
          });

          // Activate clicked card
          card.classList.remove('border', 'border-gray-200');
          card.classList.add('border-2', 'border-red-500', 'recording-radial-glow');

          // Inject subtle ambient backlight accent
          const glow = document.createElement('div');
          glow.className = 'absolute -top-12 -right-12 w-32 h-32 bg-red-500/10 rounded-full blur-2xl pointer-events-none';
          card.prepend(glow);

          // Update icon container
          const iconBox = card.querySelector('.w-11');
          if (iconBox) {
            iconBox.className = 'w-11 h-11 rounded-2xl bg-red-50 flex items-center justify-center border border-red-200 text-red-600 group-hover:border-red-400 transition-colors shadow-sm';
            const icon = iconBox.querySelector('.material-symbols-outlined');
            if (icon) icon.classList.add('material-symbols-fill');
          }

          // Radio checked indicator
          const pip = card.querySelector('.w-6');
          if (pip) {
            pip.className = 'w-6 h-6 rounded-full bg-red-600 flex items-center justify-center text-white shadow-sm ring-2 ring-red-100';
            pip.innerHTML = '<span class="material-symbols-outlined text-[15px] font-bold" data-icon="check">check</span>';
          }

          const radioInput = card.querySelector('input[type="radio"]');
          if (radioInput) radioInput.checked = true;
        });
      });
    });
  </script>
