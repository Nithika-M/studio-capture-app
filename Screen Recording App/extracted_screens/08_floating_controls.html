<script>
    // Live Recording Timer Simulation
    let secondsElapsed = 755; // 00:12:35
    let isPaused = false;
    const timerElem = document.getElementById('recordTimer');
    const pauseToggleBtn = document.getElementById('pauseToggleBtn');
    const pauseIcon = document.getElementById('pauseIcon');

    setInterval(() => {
      if (!isPaused) {
        secondsElapsed++;
        const hrs = String(Math.floor(secondsElapsed / 3600)).padStart(2, '0');
        const mins = String(Math.floor((secondsElapsed % 3600) / 60)).padStart(2, '0');
        const secs = String(secondsElapsed % 60).padStart(2, '0');
        timerElem.textContent = `${hrs}:${mins}:${secs}`;
      }
    }, 1000);

    // Pause / Resume Toggle Action
    pauseToggleBtn.addEventListener('click', () => {
      isPaused = !isPaused;
      if (isPaused) {
        pauseIcon.textContent = 'play_arrow';
        pauseToggleBtn.classList.add('text-primary-container');
        timerElem.classList.add('opacity-40');
      } else {
        pauseIcon.textContent = 'pause';
        pauseToggleBtn.classList.remove('text-primary-container');
        timerElem.classList.remove('opacity-40');
      }
    });

    // Mic Toggle Action
    const micToggleBtn = document.getElementById('micToggleBtn');
    const micIcon = document.getElementById('micIcon');
    const micPip = document.getElementById('micPip');
    let micActive = true;

    micToggleBtn.addEventListener('click', () => {
      micActive = !micActive;
      if (micActive) {
        micIcon.textContent = 'mic';
        micToggleBtn.classList.add('bg-secondary-container', 'text-primary-container');
        micToggleBtn.classList.remove('bg-surface-container-high/80', 'text-on-surface-variant');
        micPip.classList.remove('hidden');
      } else {
        micIcon.textContent = 'mic_off';
        micToggleBtn.classList.remove('bg-secondary-container', 'text-primary-container');
        micToggleBtn.classList.add('bg-surface-container-high/80', 'text-on-surface-variant');
        micPip.classList.add('hidden');
      }
    });

    // Stop Recording Feedback Interaction
    const stopRecordBtn = document.getElementById('stopRecordBtn');
    stopRecordBtn.addEventListener('click', () => {
      isPaused = true;
      const originalText = timerElem.textContent;
      timerElem.textContent = "SAVED";
      timerElem.classList.add('text-primary');
      setTimeout(() => {
        timerElem.textContent = originalText;
        timerElem.classList.remove('text-primary');
        isPaused = false;
      }, 1500);
    });
  </script>
