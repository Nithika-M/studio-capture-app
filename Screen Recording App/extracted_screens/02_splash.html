<!-- Interactive script to simulate engine initialization readiness -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
      const statusText = document.querySelector('footer p');
      const messages = [
        'Initializing capture engine...',
        'Calibrating 120 FPS render buffer...',
        'Configuring lossless audio bus...',
        'Ready to record'
      ];
      
      let index = 0;
      const interval = setInterval(() => {
        index++;
        if (index < messages.length) {
          if (statusText) {
            statusText.textContent = messages[index];
            if (index === messages.length - 1) {
              const spinner = statusText.previousElementSibling;
              if (spinner) {
                spinner.textContent = 'check_circle';
                spinner.classList.remove('animate-spin');
                spinner.classList.add('text-[#DC2626]');
              }
            }
          }
        } else {
          clearInterval(interval);
        }
      }, 1100);
    });
  </script>
